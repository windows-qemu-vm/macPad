name: Build MacWSWindowing (Apple ld64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos + ldid
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          brew install ldid 2>/dev/null || true

      - name: Build MacWSWindowing
        run: |
          cd MacWSWindowing
          make clean all FINALPACKAGE=1 STRIP=0 OPTFLAG=-O2 \
            THEOS_PACKAGE_SCHEME=rootless GO_EASY_ON_ME=1

      - name: Check binary + show fixups (info only)
        run: |
          BINARY=MacWSWindowing/.theos/obj/MacWSWindowing.dylib
          ls -la "$BINARY"
          file "$BINARY"
          echo "=== dyld_info fixups (first 40 lines) ==="
          dyld_info -arch arm64e -fixups "$BINARY" 2>&1 | head -40
          echo "=== done ==="

      - name: Package artifacts
        run: |
          BINARY=MacWSWindowing/.theos/obj/MacWSWindowing.dylib
          mkdir -p artifact
          cp "$BINARY" artifact/MacWSWindowing.dylib
          shasum -a 256 artifact/MacWSWindowing.dylib | awk '{print $1}' > artifact/MacWSWindowing.sha256
          echo '{"generated_by":"github-actions","note":"place in /var/jb/var/mobile/macws-cross-build/"}' > artifact/MacWSWindowing.build.json
          echo "=== SHA256 ==="
          cat artifact/MacWSWindowing.sha256
          echo "=== Files ==="
          ls -la artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacWSWindowing-cross-build
          path: artifact/
